[package]
name = "digivine-api-vivc"
version = "0.1.0"
authors = ["Bozhoubai <b_bai19@cs.uni-kl.de>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] } #(De)Serialization
diesel = { version = "2.0.*", features = ["postgres"] } # DB Backend
diesel_migrations = "2.0.*"
diesel_ext = {path = "../diesel-ext"}
openssl = "*" # Needed for weird postgres behavior
openssl-sys = "0.9"

log = "0.4.*" # Logging

thiserror = "1.0.*" # Error handling
macros_lib = { path = "../macros_lib" }

[dev-dependencies]
diesel_ext = { path = "../diesel-ext", features = [ "test-utils" ] }
serial_test = "0.5.*"
rand = "0.8.5"