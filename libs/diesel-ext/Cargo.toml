[package]
name = "diesel_ext"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
test-utils = ["dep:dotenv", "dep:rand"]

[dependencies]
diesel = { version = "2.0.*", features = ["postgres", "r2d2"] }
diesel_migrations = "2.0.*"
postgis_diesel = { git = "https://github.com/WeissP/postgis-diesel.git" }
dotenv = { version = "0.15.0", optional = true }
rand = { version =  "0.8.5", optional = true }
once_cell = "1.17.1"
thiserror = "1.0.*" # Error handling
log = "0.4.*" # Logging
simplelog = "0.9.0"
chrono = "0.4" 
frunk = "0.3.1"

[dev-dependencies]
openssl = "*" # Needed for weird postgres behavior

