# For documentation on how to configure this file,
# see diesel.rs/guides/configuring-diesel-cli

[print_schema]
generate_missing_sql_type_definitions = false # prevent generating Geometry type by diesel
filter = { only_tables = ["terrain", "terrain_point"] }
file = "src/schema.rs"
import_types = ["diesel::sql_types::*", "postgis_diesel::sql_types::*"]
