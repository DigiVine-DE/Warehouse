[package]
name = "digivine-api-jki-lidar"
version = "0.2.0"
authors = ["Manuel Dossinger <dossinger@cs.uni-kl.de>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] } #(De)Serialization
chrono = { version = "0.4", features = ["serde"] } # Time

diesel = { version = "2.0.*", features = ["postgres","chrono"] } # DB Backend
diesel_migrations = "2.0.*"
diesel_ext = {path = "../diesel-ext"}
openssl = "*" # Needed for weird postgres behavior
openssl-sys = "0.9"

log = "0.4.*" # Logging

thiserror = "1.0.*" # Error handling

[dev-dependencies]
diesel_ext = { path = "../diesel-ext", features = [ "test-utils" ] }