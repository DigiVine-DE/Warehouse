  /field:
    delete:
      description: |
        You can't delete the complete collection of Field data. You can delete one specific Field with `DELETE /field/{FieldId}` (`deleteOneField`).
      operationId: deleteField
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
          description: 'Bad Request: Could not parse parameters'
        "401":
          description: Missing API key.
        "403":
          description: Specified API key does not have the required rights.
        "405":
          description: Method not allowed
      summary: Can't delete complete collection
      tags:
      - Field
      - Delete
      - DeleteAll
      - Modify
    get:
      description: |
        Returns a list of (all) stored Fields.
        With the optional parameter `Box2d` parameter, only the fields that intersect the given bounding box will be returned.
        With the optional parameter `FieldNameContains`, only the fields with names containing all specified keywords (case insensitive) will be returned.
        With the optional parameter `FruitNameContains`, only the fields with fruit names containing all specified keywords (case insensitive) will be returned.
        With the optional parameter `FuzzyFieldKeywords`, only the fields with at least one string attribute containing one of the specified keywords (case insensitive) will be returned.
        With the parameters `Limit` and `Offset` it can be specified, which data to return.
        The returned fields are ordered based on the number of string segments matched by the fuzzy keywords. Fields with case-sensitive matches receive a higher score. If two fields have identical scores, they are sorted by their field ID.
        If the operation was successful (status code `200`), an array with Fields will be returned.
      operationId: getAllFields
      parameters:
      - description: The two-dimensional geometry bounding box
        explode: true
        in: query
        name: box2d
        required: false
        schema:
          $ref: '#/components/schemas/BBox'
        style: form
      - description: A set of keywords used to filter the results of fields. Only
          fields with at least one string attribute containing one of the keywords
          (case insensitive) will be returned.
        examples:
          default:
            summary: An empty array has no effect on the results
            value: []
          example1:
            summary: This will find fields with names like "Burgunder", "Hamburg",
              and "Hamburger", but not "Berg"
            value:
            - Burg
          example2:
            summary: This will find fields with names like "Dürkheimer Michelsberg"
              and/or fruit names like "Riesling", but not field with name "Hamburg"
              and fruit names "Dornfelder"
            value:
            - Dürk
            - Ries
        explode: true
        in: query
        name: fuzzyFieldKeywords
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: A set of keywords used to filter the results of fields. Only
          fields with a name containing all of the specified keywords (case insensitive)
          will be returned.
        examples:
          default:
            summary: An empty array has no effect on the results
            value: []
          example1:
            summary: This will find fields with names like "Dürkheimer Michelsberg",
              but not fields with names like "Michelsberg"
            value:
            - Mich
            - dürk
        explode: true
        in: query
        name: fieldNameContains
        required: false
        schema:
          items:
            type: string
          type: array
          uniqueItems: true
        style: form
      - description: A set of keywords used to filter the results of fields. Only
          fields with a fruit_name containing all of the specified keywords (case
          insensitive) will be returned.
        examples:
          default:
            summary: An empty array has no effect on the results
            value: []
          example1:
            summary: This will find fields with fruit names like "Riesling", but not
              fields with fruit names like "Chardonnay" or "Ries"
            value:
            - ries
            - ing
        explode: true
        in: query
        name: fruitNameContains
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      - description: The number of items to skip before starting to collect the result
          set
        examples:
          min:
            summary: The minimum number of items, which can be skipped before returning.
            value: 0
          default:
            summary: The default number of items, which will be skipped before returning,
              if no value is given for the limit parameter.
            value: 0
          other:
            summary: Another example for the offset parameter.
            value: 815
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: The number of items to return
        examples:
          min:
            summary: The minimum number of items, which can be returned.
            value: 1
          default:
            summary: The default number of items, which will be returned, if no value
              is given for the limit parameter.
            value: 100
          other:
            summary: Another example for the limit parameter.
            value: 815
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Field'
                type: array
          description: Successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_400'
          description: 'Bad Request: Could not parse parameters'
        "401":
          description: Missing API key.
        "403":
          description: Specified API key does not have the required rights.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Backend Error
      summary: Returns a list of (all) stored Fields
      tags:
      - Field
      - Get
      - GetAll
