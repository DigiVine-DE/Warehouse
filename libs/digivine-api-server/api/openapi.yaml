        name: UserId
        required: true
        schema:
          example: 4711
          format: int32
          type: integer
        style: simple
      - description: The token string of the token to retrieve
        explode: false
        in: path
        name: Tokenstr
        required: true
        schema:
          type: string
        style: simple
      - description: The path of the access right
        explode: false
        in: path
        name: AccessRightPath
        required: true
