        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Backend Error
      summary: Creates a new access right for a specific token
      tags:
      - Token
      - AccessRight
      - Add
      - Modify
  /token/{UserId}/{Tokenstr}/access_right/{AccessRightPath}:
