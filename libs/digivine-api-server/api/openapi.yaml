  parameters:
    Limit:
      description: The number of items to return
      examples:
        min:
          summary: The minimum number of items, which can be returned.
          value: 1
        default:
          summary: The default number of items, which will be returned, if no value
            is given for the limit parameter.
          value: 100
        other:
          summary: Another example for the limit parameter.
          value: 815
      explode: true
      in: query
      name: limit
      required: false
      schema:
        default: 100
        minimum: 1
        type: integer
      style: form
    Offset:
      description: The number of items to skip before starting to collect the result
        set
      examples:
        min:
          summary: The minimum number of items, which can be skipped before returning.
          value: 0
        default:
          summary: The default number of items, which will be skipped before returning,
            if no value is given for the limit parameter.
          value: 0
        other:
          summary: Another example for the offset parameter.
          value: 815
      explode: true
      in: query
      name: offset
      required: false
      schema:
        default: 0
        minimum: 0
        type: integer
      style: form
    Box2d:
      description: The two-dimensional geometry bounding box
      explode: true
      in: query
      name: box2d
      required: false
      schema:
        $ref: '#/components/schemas/BBox'
      style: form
    FuzzyFieldKeywords:
      description: A set of keywords used to filter the results of fields. Only fields
        with at least one string attribute containing one of the keywords (case insensitive)
        will be returned.
      examples:
        default:
          summary: An empty array has no effect on the results
          value: []
        example1:
          summary: This will find fields with names like "Burgunder", "Hamburg", and
            "Hamburger", but not "Berg"
          value:
          - Burg
        example2:
          summary: This will find fields with names like "Dürkheimer Michelsberg"
            and/or fruit names like "Riesling", but not field with name "Hamburg"
            and fruit names "Dornfelder"
          value:
          - Dürk
          - Ries
      explode: true
      in: query
      name: fuzzyFieldKeywords
      required: false
      schema:
        items:
          type: string
        type: array
      style: form
    FruitNameContains:
      description: A set of keywords used to filter the results of fields. Only fields
        with a fruit_name containing all of the specified keywords (case insensitive)
        will be returned.
      examples:
        default:
          summary: An empty array has no effect on the results
          value: []
        example1:
          summary: This will find fields with fruit names like "Riesling", but not
            fields with fruit names like "Chardonnay" or "Ries"
          value:
          - ries
          - ing
      explode: true
      in: query
      name: fruitNameContains
      required: false
      schema:
        items:
          type: string
        type: array
      style: form
    FieldNameContains:
      description: A set of keywords used to filter the results of fields. Only fields
        with a name containing all of the specified keywords (case insensitive) will
        be returned.
      examples:
        default:
          summary: An empty array has no effect on the results
          value: []
        example1:
          summary: This will find fields with names like "Dürkheimer Michelsberg",
            but not fields with names like "Michelsberg"
          value:
          - Mich
          - dürk
      explode: true
      in: query
      name: fieldNameContains
      required: false
      schema:
        items:
          type: string
        type: array
        uniqueItems: true
      style: form
    Tokenstr:
      description: The token string of the token to retrieve
      explode: false
      in: path
      name: Tokenstr
      required: true
      schema:
        type: string
      style: simple
    TokenstrContains:
      description: A set of keywords used to filter tokens. Only tokens that contain
        all of the specified keywords (case insensitive) will be returned.
      examples:
        default:
          summary: An empty array has no effect on the results
          value: []
        example1:
          summary: This will find tokens like "all_readonly", but not tokens like
